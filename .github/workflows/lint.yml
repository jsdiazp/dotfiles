name: Lint

# Static checks for the shell side of the dotfiles.
#   - shellcheck: correctness/smell checks (.shellcheckrc at repo root)
#   - shfmt:     formatting, driven by .editorconfig (no CLI flags on purpose)
#
# Both steps are strict: they fail on any finding or formatting diff. The
# repo is kept clean, so a red run means a real regression. Reproduce locally
# with the same versions: `shellcheck -x setup.sh scripts/*/*.sh` and
# `shfmt -d setup.sh scripts/*/*.sh` (formatting rules live in .editorconfig).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned upstream releases, verified against the SHA-256 digests GitHub
      # publishes for each asset. The repo is kept clean against exactly these
      # versions, so CI cannot drift when the runner image's apt packages move.
      # No third-party actions. To bump: update the version and digest together.
      - name: Install shellcheck and shfmt
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/shellcheck.tar.gz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  $tmp/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/shellcheck.tar.gz" -C "$tmp"
          sudo install -m 0755 "$tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o "$tmp/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 "$tmp/shfmt" /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      # setup.sh plus every task script. `scripts/*/*.sh` keeps the same file
      # set used by the acceptance checks and skips vendored tmux plugins.
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(setup.sh scripts/*/*.sh)
          printf 'shellcheck: %d file(s)\n' "${#files[@]}"
          shellcheck -x "${files[@]}"

      # No -i/-ci flags: formatting options come from .editorconfig, which is
      # the same file editors read. -d prints a diff and exits non-zero.
      - name: shfmt
        run: |
          shopt -s nullglob
          files=(setup.sh scripts/*/*.sh)
          printf 'shfmt: %d file(s)\n' "${#files[@]}"
          shfmt -d "${files[@]}"
